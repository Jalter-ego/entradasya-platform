# EntradasYa — Gateway local (modo demo / build estático)
# Sirve la web compilada (apps/web/dist) y enruta las 5 APIs públicas conservando /api.
# Bloquea /internal/* y NO expone payments (3004) ni notifications (3006).

server {
    listen 8080;
    listen [::]:8080;
    server_name localhost 127.0.0.1;

    server_tokens off;
    client_max_body_size 1m;

    # Ruta raíz al build de React (reemplazar en Linux/Windows según ruta real del repo)
    root /var/www/entradasya/apps/web/dist;
    index index.html;

    # Bloquear cualquier ruta interna en el gateway público
    location ^~ /internal {
        return 404;
    }

    # --- APIs públicas (conservan el prefijo /api) -----------------------------
    location ~ ^/api/auth(/|$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location ~ ^/api/events(/|$) {
        client_max_body_size 4m; # Portada de 3 MB + multipart
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location ~ ^/api/orders(/|$) {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location ~ ^/api/tickets(/|$) {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 3s;
        # Mayor margen acotado para generación/descarga de PDF
        proxy_read_timeout 20s;
    }

    location ~ ^/api/checkin(/|$) {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # --- SPA React (incluye /mis-entradas, /porteria, /organizador/*) --------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
