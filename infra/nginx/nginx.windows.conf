# Configuración autocontenida de Nginx para Windows (modo demo / dev)
# Ajusta `root` si sirves el build estático o usa el bloque Vite para desarrollo.

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen       8080;
        server_name  localhost 127.0.0.1;

        # Bloquear /internal/*
        location ^~ /internal {
            return 404;
        }

        location ~ ^/api/auth(/|$) {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
        }

        location ~ ^/api/events(/|$) {
            proxy_pass http://127.0.0.1:3002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
        }

        location ~ ^/api/orders(/|$) {
            proxy_pass http://127.0.0.1:3003;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
        }

        location ~ ^/api/tickets(/|$) {
            proxy_pass http://127.0.0.1:3005;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_read_timeout 20s;
        }

        location ~ ^/api/checkin(/|$) {
            proxy_pass http://127.0.0.1:3007;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
        }

        # Por defecto apunta a Vite en desarrollo; para demo estática cambia por:
        #   root C:/ruta/al/repo/apps/web/dist;
        #   try_files $uri $uri/ /index.html;
        location / {
            proxy_pass http://127.0.0.1:5173;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
